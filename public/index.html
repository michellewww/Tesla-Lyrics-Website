<!doctype html>
<html lang="en" data-theme="dark" class="booting">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#121212">
  <meta name="description" content="Live, synced lyrics for whatever is playing on Spotify — sized for a car touchscreen.">
  <title>Tesla Lyrics</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script>
    // Apply the light/dark theme before first paint (see js/theme.js), and never
    // stay hidden if the app script fails to load.
    try {
      var p = localStorage.getItem('settings:theme') || 'auto';
      document.documentElement.dataset.theme =
        p === 'light' || p === 'dark' ? p : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    } catch (e) {}
    setTimeout(function () { document.documentElement.classList.remove('booting'); }, 1500);
  </script>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.6-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1.2"/><rect x="14" y="4.5" width="4" height="15" rx="1.2"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 6.2v11.6a1 1 0 0 0 1.55.83L15 12.83V17a1 1 0 0 0 2 0V7a1 1 0 0 0-2 0v4.17L6.55 5.37A1 1 0 0 0 5 6.2z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M19 6.2v11.6a1 1 0 0 1-1.55.83L9 12.83V17a1 1 0 0 1-2 0V7a1 1 0 0 1 2 0v4.17l8.45-5.8A1 1 0 0 1 19 6.2z"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4v2H6v3H4zm11-5h4a1 1 0 0 1 1 1v4h-2V6h-3V4zM4 15h2v3h3v2H5a1 1 0 0 1-1-1v-4zm14 0h2v4a1 1 0 0 1-1 1h-4v-2h3v-3z"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6a.5.5 0 0 0 .1-.6l-1.9-3.3a.5.5 0 0 0-.6-.2l-2.4 1a7.3 7.3 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-3.8a.5.5 0 0 0-.5.4l-.4 2.6a7.3 7.3 0 0 0-1.7 1l-2.4-1a.5.5 0 0 0-.6.2L2.5 8.8a.5.5 0 0 0 .1.6l2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6a.5.5 0 0 0-.1.6l1.9 3.3c.1.2.4.3.6.2l2.4-1a7.3 7.3 0 0 0 1.7 1l.4 2.6c0 .2.3.4.5.4h3.8c.2 0 .5-.2.5-.4l.4-2.6a7.3 7.3 0 0 0 1.7-1l2.4 1c.2.1.5 0 .6-.2l1.9-3.3a.5.5 0 0 0-.1-.6l-2-1.6zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18.5a3 3 0 1 1-2-2.83V6.6a1 1 0 0 1 .76-.97l10-2.5A1 1 0 0 1 19 4.1v11.4a3 3 0 1 1-2-2.83V8.03l-8 2v8.47z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7z"/></symbol>
  </svg>

  <div class="backdrop" aria-hidden="true">
    <div class="art" id="art-a"></div>
    <div class="art" id="art-b"></div>
    <div class="tint"></div>
  </div>

  <!-- First run: no Spotify Client ID configured yet -->
  <section id="screen-setup" class="screen card-screen" hidden>
    <div class="card">
      <h1 data-i18n="setup.title">Set up Spotify</h1>
      <p class="muted" data-i18n="setup.intro"></p>
      <ol class="steps">
        <li><span data-i18n-html="setup.step1"></span></li>
        <li><span data-i18n-html="setup.step2"></span>
          <div class="copy-row"><code id="redirect-uri"></code><button type="button" class="btn small" id="copy-redirect" data-i18n="setup.copy">Copy</button></div>
        </li>
        <li><span data-i18n-html="setup.step3"></span>
          <form id="client-form" class="copy-row">
            <input id="client-id" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="setup.placeholder" aria-label="Spotify Client ID" required>
            <button class="btn primary" type="submit" data-i18n="setup.save">Save</button>
          </form>
          <p id="client-error" class="error" hidden></p>
        </li>
      </ol>
      <p class="muted small" data-i18n-html="setup.note"></p>
      <p><a href="?demo" class="link" data-i18n="setup.demo">Try the demo instead →</a></p>
    </div>
  </section>

  <!-- Logged out -->
  <section id="screen-login" class="screen card-screen" hidden>
    <div class="card center">
      <div class="hero-lines" aria-hidden="true"><span></span><span></span><span></span></div>
      <h1 data-i18n="login.title">Lyrics for the road</h1>
      <p class="muted" data-i18n="login.sub"></p>
      <p id="login-error" class="error" hidden></p>
      <button id="login" class="btn spotify big" type="button" data-i18n="login.button">Log in with Spotify</button>
      <p class="links">
        <a href="?demo" class="link" data-i18n="login.demo">Try the demo</a>
        <button id="change-client" type="button" class="link-btn" data-i18n="login.changeClient" hidden></button>
      </p>
      <p class="muted small" data-i18n-html="login.disclaimer"></p>
    </div>
  </section>

  <!-- Now playing + lyrics -->
  <main id="screen-player" class="screen player" hidden>
    <aside class="side">
      <div class="cover-wrap">
        <img id="cover" class="cover" alt="" hidden>
        <div id="cover-placeholder" class="cover placeholder"><svg><use href="#i-note"/></svg></div>
      </div>
      <div class="meta">
        <h1 id="title" class="title"></h1>
        <p id="artist" class="artist"></p>
        <p class="chips"><span id="sync-chip" class="chip" hidden></span><span class="chip demo-chip" data-i18n="demo.badge">Demo</span></p>
      </div>
      <div class="progress">
        <div id="seekbar" class="seekbar" role="slider" data-i18n-aria="aria.seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <div class="track"><div id="bar-fill" class="fill"></div><div id="bar-thumb" class="thumb"></div></div>
        </div>
        <div class="times"><span id="t-pos">0:00</span><span id="t-dur">0:00</span></div>
      </div>
      <div class="controls">
        <button id="btn-prev" class="icon-btn" type="button" data-i18n-aria="aria.prev"><svg><use href="#i-prev"/></svg></button>
        <button id="btn-play" class="icon-btn play" type="button" data-i18n-aria="aria.play"><svg><use href="#i-play"/></svg></button>
        <button id="btn-next" class="icon-btn" type="button" data-i18n-aria="aria.next"><svg><use href="#i-next"/></svg></button>
      </div>
      <div class="tools">
        <div class="group" role="group">
          <button id="font-down" class="pill" type="button" data-i18n-aria="aria.smaller"><span class="aa small-a">A</span></button>
          <button id="font-up" class="pill" type="button" data-i18n-aria="aria.larger"><span class="aa big-a">A</span></button>
        </div>
        <div class="group" role="group">
          <button id="sync-later" class="pill" type="button" data-i18n-title="sync.laterTitle">−</button>
          <button id="sync-reset" class="pill sync-label" type="button" data-i18n-title="sync.resetTitle"><svg><use href="#i-clock"/></svg><span id="sync-label"></span></button>
          <button id="sync-earlier" class="pill" type="button" data-i18n-title="sync.earlierTitle">+</button>
        </div>
        <button id="btn-menu" class="pill icon" type="button" data-i18n-aria="aria.settings"><svg><use href="#i-gear"/></svg></button>
      </div>
      <p id="conn" class="conn" data-i18n="conn.reconnecting" hidden></p>
    </aside>

    <section class="lyrics-wrap">
      <div id="lyrics" class="lyrics"></div>
      <div id="status" class="status" hidden>
        <div class="status-icon"><svg><use href="#i-note"/></svg></div>
        <h2 id="status-title"></h2>
        <p id="status-text" class="muted"></p>
        <button id="status-retry" class="btn" type="button" data-i18n="status.retry" hidden></button>
      </div>
      <button id="recenter" class="btn recenter" type="button" data-i18n="lyrics.recenter" hidden></button>
    </section>
  </main>

  <dialog id="menu" class="sheet">
    <form method="dialog" class="sheet-body">
      <header class="sheet-head">
        <h2 data-i18n="settings.title">Settings</h2>
        <button class="btn primary" value="close" data-i18n="settings.done">Done</button>
      </header>

      <h3 data-i18n="settings.lyrics">Lyrics</h3>
      <div class="row">
        <label for="font-range" data-i18n="settings.textSize">Text size</label>
        <div class="range-row">
          <button type="button" class="pill" data-font-step="-0.1"><span class="aa small-a">A</span></button>
          <input id="font-range" type="range" min="60" max="180" step="5">
          <button type="button" class="pill" data-font-step="0.1"><span class="aa big-a">A</span></button>
          <output id="font-value" class="value"></output>
        </div>
      </div>
      <div class="row">
        <label data-i18n="settings.timing">Timing offset</label>
        <div class="stepper">
          <button type="button" class="pill" data-offset-step="-500">−0.5</button>
          <button type="button" class="pill" data-offset-step="-100">−0.1</button>
          <output id="offset-value" class="value wide"></output>
          <button type="button" class="pill" data-offset-step="100">+0.1</button>
          <button type="button" class="pill" data-offset-step="500">+0.5</button>
          <button type="button" class="pill" id="offset-reset" data-i18n="settings.reset">Reset</button>
        </div>
      </div>
      <p class="hint" data-i18n="settings.timingHint"></p>
      <div class="row">
        <span data-i18n="settings.align">Alignment</span>
        <div class="segmented" data-setting="align">
          <button type="button" data-value="left" data-i18n="settings.alignLeft">Left</button>
          <button type="button" data-value="center" data-i18n="settings.alignCenter">Center</button>
        </div>
      </div>
      <div class="row">
        <label for="karaoke-toggle" data-i18n="settings.karaoke">Karaoke highlight</label>
        <input id="karaoke-toggle" class="switch" type="checkbox" data-setting-bool="karaoke">
      </div>
      <p class="hint" data-i18n="settings.karaokeHint"></p>
      <div class="row">
        <label for="translation-toggle" data-i18n="settings.translation">Show translations</label>
        <input id="translation-toggle" class="switch" type="checkbox" data-setting-bool="translation">
      </div>
      <div class="row">
        <span data-i18n="settings.highlight">Highlight color</span>
        <div class="swatches" data-setting="highlight">
          <button type="button" data-value="default" class="swatch sw-default" data-i18n-title="hl.default"></button>
          <button type="button" data-value="cover" class="swatch sw-cover" data-i18n-title="hl.cover"></button>
          <button type="button" data-value="green" class="swatch sw-green" data-i18n-title="hl.green"></button>
          <button type="button" data-value="gold" class="swatch sw-gold" data-i18n-title="hl.gold"></button>
          <button type="button" data-value="pink" class="swatch sw-pink" data-i18n-title="hl.pink"></button>
        </div>
      </div>

      <h3 data-i18n="settings.display">Display</h3>
      <div class="row">
        <span data-i18n="settings.appearance">Appearance</span>
        <div class="segmented" data-setting="theme">
          <button type="button" data-value="auto" data-i18n="theme.auto">Auto</button>
          <button type="button" data-value="light" data-i18n="theme.light">Light</button>
          <button type="button" data-value="dark" data-i18n="theme.dark">Dark</button>
        </div>
      </div>
      <p class="hint" data-i18n="settings.appearanceHint"></p>
      <div class="row">
        <span data-i18n="settings.background">Background</span>
        <div class="segmented" data-setting="background">
          <button type="button" data-value="blur" data-i18n="bg.blur">Blurred cover</button>
          <button type="button" data-value="color" data-i18n="bg.color">Album color</button>
        </div>
      </div>
      <div class="row" id="fullscreen-row" hidden>
        <label for="fullscreen-toggle" data-i18n="aria.fullscreen">Full screen</label>
        <input id="fullscreen-toggle" class="switch" type="checkbox">
      </div>
      <div class="row">
        <span data-i18n="settings.language">Language</span>
        <div class="segmented" data-setting="lang">
          <button type="button" data-value="auto" data-i18n="lang.auto">Auto</button>
          <button type="button" data-value="en" lang="en">English</button>
          <button type="button" data-value="zh-CN" lang="zh-CN">简体中文</button>
        </div>
      </div>

      <h3 data-i18n="settings.account">Account</h3>
      <div class="menu-actions">
        <button id="menu-logout" type="button" class="btn" data-i18n="settings.logout">Log out of Spotify</button>
        <button id="menu-exit-demo" type="button" class="btn" data-i18n="settings.exitDemo" hidden>Exit demo</button>
        <button id="menu-client" type="button" class="btn" data-i18n="settings.changeClient" hidden>Change Client ID</button>
      </div>
      <p class="hint" data-i18n-html="settings.tip"></p>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript">This site needs JavaScript to show lyrics. 本网站需要启用 JavaScript。</p></noscript>
</body>
</html>
